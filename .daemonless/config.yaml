# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

icon: ':material-monitor-dashboard:'

build:
  architectures:
    - amd64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true

cit:
  mode: screenshot
  port: 8090
  health: /api/health
  screenshot: /
  screenshot_wait: 5
  ready: "Server started at"
